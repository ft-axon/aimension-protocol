<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<rect width="100" height="100" fill="#0D0C0A" rx="12"/>
<g transform="translate(50, 50)">

<!-- Outer hexagon lines - thicker for visibility at small sizes -->
<line x1="0" y1="-34" x2="29" y2="-17" stroke="#B8975A" stroke-width="2.5" opacity="0.7"/>
<line x1="29" y1="-17" x2="29" y2="17" stroke="#B8975A" stroke-width="2.5" opacity="0.7"/>
<line x1="29" y1="17" x2="0" y2="34" stroke="#B8975A" stroke-width="2.5" opacity="0.7"/>
<line x1="0" y1="34" x2="-29" y2="17" stroke="#B8975A" stroke-width="2.5" opacity="0.7"/>
<line x1="-29" y1="17" x2="-29" y2="-17" stroke="#B8975A" stroke-width="2.5" opacity="0.7"/>
<line x1="-29" y1="-17" x2="0" y2="-34" stroke="#B8975A" stroke-width="2.5" opacity="0.7"/>

<!-- 3 axon lines from top node to center - white, bold -->
<line x1="0" y1="-34" x2="0" y2="0" stroke="#FAF8F4" stroke-width="3" opacity="0.95"/>
<line x1="29" y1="-17" x2="0" y2="0" stroke="#FAF8F4" stroke-width="3" opacity="0.95"/>
<line x1="-29" y1="-17" x2="0" y2="0" stroke="#FAF8F4" stroke-width="3" opacity="0.95"/>

<!-- Hex nodes - gold -->
<circle cx="0" cy="-34" r="5.5" fill="#FAF8F4"/>
<circle cx="29" cy="-17" r="4" fill="#B8975A"/>
<circle cx="29" cy="17" r="4" fill="#B8975A"/>
<circle cx="0" cy="34" r="4" fill="#B8975A"/>
<circle cx="-29" cy="17" r="4" fill="#B8975A"/>
<circle cx="-29" cy="-17" r="4" fill="#B8975A"/>

<!-- Center node -->
<circle cx="0" cy="0" r="7" fill="none" stroke="#B8975A" stroke-width="2.5"/>
<circle cx="0" cy="0" r="3.5" fill="#B8975A"/>

</g>
</svg>
